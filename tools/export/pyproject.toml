# Python environment for scripts/export-models.sh. Versions are pinned so the
# Core ML export is reproducible; uv.lock holds the full resolution.
[project]
name = "obs-matanyone2-export"
version = "0.1.0"
description = "Pinned environment for exporting MatAnyone 2 to Core ML"
requires-python = ">=3.11,<3.12"
dependencies = [
    "coremltools==9.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "numpy==2.4.6",
    "omegaconf==2.3.1",
    "hydra-core==1.3.6",
    "einops==0.8.2",
    "huggingface_hub==0.36.2",
    "safetensors==0.8.0",
    "opencv-python==4.11.0.86",
    "pillow==12.3.0",
    "imageio==2.25.0",
    "tqdm==4.70.0",
]

[tool.uv]
package = false
