MatAnyone2Matting="MatAnyone 2 Matting"

Calibration="Calibration"
CaptureCleanPlate="Capture clean plate"
CaptureCleanPlate.Description="Starts the countdown, then averages frames of the empty room. Leave the frame and take the chair, microphone and boom arm out of it."
CapturePropsPlate="Capture props plate"
CapturePropsPlate.Description="Starts the countdown, then averages frames with the props in their normal positions and nobody in frame. The difference to the clean plate becomes the props mask."
SeedNow="Seed tracker now"
SeedNow.Description="Sit down with the props in their calibrated positions. The person mask from Vision is combined with the props mask and handed to the tracker."
ReseedNow="Re-seed now"
ReseedNow.Description="Clears the tracker memory and seeds again with the person plus the props where the tracker currently sees them. Use it after props moved or the matte drifted."
ClearCalibration="Clear calibration"
ClearCalibration.Description="Deletes both plates and the props mask from disk and stops tracking."
CountdownSeconds="Countdown"
CountdownSeconds.Description="Seconds between pressing a capture button and the start of the capture."
PlateFrames="Plate averaging frames"
PlateFrames.Description="Number of frames averaged into each plate to reduce sensor noise."
PropsThreshold="Props difference threshold"
PropsThreshold.Description="Per-pixel difference (0-255) between the two plates that counts as a prop. Raise it when background noise appears in the props mask, lower it when parts of a prop are missing."
PropsMinRegion="Minimum props region size"
PropsMinRegion.Description="Connected regions smaller than this many working-resolution pixels are discarded from the props mask."
ReseedInterval="Periodic re-seed interval"
ReseedInterval.Description="Re-seeds automatically every N seconds with the person from Vision and the props where the tracker sees them. 0 turns it off. It repairs drift but cannot recover a prop the tracker already lost."

OutputQuality="Output quality"
EdgeRefinement="Edge refinement"
EdgeRefinement.Description="How the working-resolution matte is upscaled to the frame. Bilateral and guided use the full-resolution image to sharpen edges on the GPU; both cost under 1 ms per frame. Bilateral gives the cleanest edges. None shows the 512x288 steps on diagonal edges."
EdgeRefinement.None="None (linear upscale)"
EdgeRefinement.Bilateral="Joint bilateral upsampling"
EdgeRefinement.Guided="Guided filter"
EdgeOffset="Edge feather / erode"
EdgeOffset.Description="Negative values shrink the matte by that many working-resolution pixels, positive values soften the edge by that radius."
TemporalSmoothing="Temporal alpha smoothing"
TemporalSmoothing.Description="Weight of the previous matte blended into the new one. 0 is off; higher values reduce flicker but add lag to fast motion."
Alignment="Frame/matte alignment"
Alignment.Description="Lowest latency composites the newest frame with the newest matte. Aligned holds frames in a small ring and composites each frame with its own matte; the added latency is shown in the status line."
Alignment.LowestLatency="Lowest latency"
Alignment.Aligned="Aligned"

Performance="Performance"
ComputeUnits="Compute units"
ComputeUnits.Description="Where Core ML runs the models. Changing it reloads the models; calibration is kept."
ComputeUnits.CpuAne="CPU + Neural Engine"
ComputeUnits.CpuGpu="CPU + GPU"
ComputeUnits.All="All"
MaxMatteFps="Inference throttle"
MaxMatteFps.Description="Maximum matte rate. 0 runs inference as fast as the hardware allows."
GpuDownscale="Downscale on GPU before staging"
GpuDownscale.Description="Shrinks the frame to the working resolution on the GPU and copies only that to the CPU. Off stages the full frame and downscales on the CPU; kept for comparison."
SpeckFilter="Remove tiny specks"
SpeckFilter.Description="Drops isolated islands smaller than a few dozen pixels from the matte before it is used."

Diagnostics="Diagnostics"
OverlayCalibration="Show calibration overlay in output"
OverlayCalibration.Description="Draws the countdown, the current step and errors on the video. The overlay is part of the filter output, so anything consuming the virtual camera sees it too."
OverlayAlways="Overlay always visible"
OverlayAlways.Description="Also shows the status line while tracking, not only during calibration."
MattePreview="Matte preview"
MattePreview.Description="Replaces the output with the matte itself, or composites over a checkerboard, to judge edge quality."
MattePreview.Off="Off"
MattePreview.Alpha="Alpha only"
MattePreview.Checkerboard="Alpha over checkerboard"
VerboseLogging="Verbose logging"
VerboseLogging.Description="Writes a log line for every prediction instead of every 120."
